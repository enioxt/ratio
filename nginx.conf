server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Escritório sub-path
    location /escritorio/ {
        try_files $uri $uri/ /escritorio/index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
